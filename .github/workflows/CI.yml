name: Terraform CI-CD

on:
  push:
    branches:
      - features/CIpipeline
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
env:
  TF_WORKING_DIR: ./prod_parent_module
  TF_IN_AUTOMATION: true
  ARM_USE_OIDC: true

jobs:

  # ==========================================================
  # 1. SECURITY SCAN + TERRAFORM VALIDATION
  # ==========================================================
  scan:
    name: Terraform Security Scan
    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Version
        run: terraform version

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # ========================================================
      # GITLEAKS
      # ========================================================

      - name: Check Gitleaks
        run: |
          if ! command -v gitleaks >/dev/null 2>&1; then
            echo "Gitleaks is not installed on this self-hosted runner."
            exit 1
          fi

          gitleaks version

      - name: Gitleaks Secret Scan
        run: |
          gitleaks detect \
            --source . \
            --no-banner \
            --redact


  # ==========================================================
  # 2. TERRAFORM PLAN
  # ==========================================================
  plan:
    name: Terraform Plan
    needs: scan
    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ========================================================
      # AZURE OIDC LOGIN
      # ========================================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        run: |
          az account show

      # ========================================================
      # TERRAFORM INIT
      # ========================================================

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      # ========================================================
      # TERRAFORM VALIDATE
      # ========================================================

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # ========================================================
      # TERRAFORM PLAN
      # ========================================================

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -out=tfplan \
            -var="cnt=2"

      # ========================================================
      # UPLOAD PLAN
      # ========================================================

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1


  # ==========================================================
  # 3. TERRAFORM APPLY
  # ==========================================================
  apply:
    name: Terraform Apply
    needs: plan
    runs-on: self-hosted

    # ========================================================
    # IMPORTANT:
    # Configure "production" environment in GitHub
    # with Required Reviewers for manual approval.
    # ========================================================

    environment:
      name: production

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ========================================================
      # AZURE OIDC LOGIN
      # ========================================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        run: |
          az account show

      # ========================================================
      # TERRAFORM INIT
      # ========================================================

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      # ========================================================
      # DOWNLOAD APPROVED PLAN
      # ========================================================

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}

      # ========================================================
      # CHECK PLAN FILE
      # ========================================================

      - name: Verify Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          if [ ! -f tfplan ]; then
            echo "ERROR: tfplan file not found."
            exit 1
          fi

          ls -lh tfplan

      # ========================================================
      # TERRAFORM APPLY
      # ========================================================

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -auto-approve \
            tfplan